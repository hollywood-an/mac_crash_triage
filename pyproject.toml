[project]
name = "crashtriage"
version = "0.1.0"
description = "Group macOS crash reports (.ips) by root cause and produce a ranked triage report."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
crashtriage = "crashtriage.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crashtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
